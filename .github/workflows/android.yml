
name: Build Mervy Antivirus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Installer Python et Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Compiler APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: MERVY-ANTIVIRUS-APK
          path: bin/*.apk
          if-no-files-found: error
